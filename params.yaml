# Model parameters
model:
  type: lightgbm
  params:
    num_leaves: 31
    learning_rate: 0.05
    n_estimators: 100
    max_depth: -1
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

# Data split
data:
  test_size: 0.2
  random_state: 42

# Feature engineering
features:
  categorical:
    - gender
    - Partner
    - Dependents
    - PhoneService
    - InternetService
    - Contract
  numerical:
    - tenure
    - MonthlyCharges
    - TotalCharges
