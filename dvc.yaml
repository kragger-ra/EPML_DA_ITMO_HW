stages:
  # Stg1: Data Preprocessing
  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - src/data/preprocess.py
      - data/raw/customer_churn.csv
    params:
      - data
      - features
    outs:
      - data/processed/X_train.csv:
          cache: true
      - data/processed/X_test.csv:
          cache: true
      - data/processed/y_train.csv:
          cache: true
      - data/processed/y_test.csv:
          cache: true

  # Stg2: Model Training
  train:
    cmd: python src/models/train_hydra.py
    deps:
      - src/models/train_hydra.py
      - src/models/model_factory.py
      - data/processed/X_train.csv
      - data/processed/X_test.csv
      - data/processed/y_train.csv
      - data/processed/y_test.csv
      - conf/config.yaml
      - conf/model
      - conf/data
      - conf/training
    outs:
      - models/lightgbm_model.pkl:
          cache: true
    metrics:
      - metrics.json:
          cache: false

  # Stg3: Train All Models
  train_all:
    cmd: python src/pipelines/run_all_experiments.py
    deps:
      - src/pipelines/run_all_experiments.py
      - src/models/train_hydra.py
      - src/models/model_factory.py
      - data/processed/X_train.csv
      - data/processed/X_test.csv
      - data/processed/y_train.csv
      - data/processed/y_test.csv
      - conf/config.yaml
      - conf/model
    outs:
      - experiments/pipeline_results.csv:
          cache: false

  # Stg4: Model Evaluation
  evaluate:
    cmd: python src/pipelines/evaluate_models.py
    deps:
      - src/pipelines/evaluate_models.py
      - metrics.json
    outs:
      - reports/evaluation/model_comparison.csv:
          cache: false
      - reports/evaluation/best_model.json:
          cache: false

  # Stg5: Select Best Model
  select_best:
    cmd: python src/pipelines/select_best_model.py
    deps:
      - src/pipelines/select_best_model.py
      - reports/evaluation/best_model.json
    outs:
      - models/best/best_model.pkl:
          cache: true
      - models/best/model_metadata.json:
          cache: false
      - models/churn_model.pkl:
          cache: true

  # Stg: Report
  report:
    cmd: python src/pipelines/generate_report.py
    deps:
      - src/pipelines/generate_report.py
      - models/churn_model.pkl
      - metrics.json
      - reports/evaluation/best_model.json
    outs:
      - reports/pipeline_report.md:
          cache: false

  # Stg7: Notification
  notify:
    cmd: python src/pipelines/notify.py
    deps:
      - src/pipelines/notify.py
      - reports/pipeline_report.md
    outs:
      - reports/notifications:
          cache: false
